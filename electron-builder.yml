appId: org.hermes.voice
productName: Hermes Voice
artifactName: Hermes-Voice-${version}-${os}-${arch}.${ext}
asar: false
afterPack: scripts/verify-package.cjs
directories:
  app: dist/public
  output: dist/installers
files:
  - '**/*'
  - '!**/node_modules/electron{,/**}'
  - '!**/node_modules/electron-builder{,/**}'
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
linux:
  category: Utility
  maintainer: Hermes Voice contributors
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
