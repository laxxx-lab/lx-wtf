name: Desktop preview installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source privacy regression
        run: node --test tests/public-privacy.test.cjs
      - name: Scan tracked history locally for credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --location --proto '=https' "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o scanner.tar.gz
          curl --fail --location --proto '=https' "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          expected="$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)"
          test "${#expected}" = 64
          printf '%s  scanner.tar.gz\n' "$expected" | sha256sum --check --status
          tar -xzf scanner.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --config .gitleaks.toml --redact=100 --no-banner
  package:
    needs: privacy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-22.04
            target: --linux --x64
          - os: macos-14
            target: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Full Node regression suite (bounded native subprocess load)
        run: node --test --test-concurrency=4 tests/*.test.cjs
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: python -m unittest discover -s tests -p portable_speech_test.py
      - name: Prepare audited public payload
        run: npm run package:prepare
      - name: Package unsigned preview
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Linux packaged Electron smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          artifact="$(find dist/installers -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          chmod u+x "$artifact"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$artifact" --version | grep -F 'v44.7.2'
      - name: Checksums of installer artifacts
        shell: bash
        run: |
          cd dist/installers
          python - <<'PY'
          import hashlib, pathlib
          files = sorted(p for p in pathlib.Path('.').iterdir() if p.is_file() and p.suffix in {'.exe', '.AppImage', '.deb', '.dmg', '.zip'})
          with open('SHA256SUMS', 'w', encoding='utf-8') as out:
              for path in files:
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  out.write(f'{digest}  {path.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-voice-preview-${{ matrix.os }}
          path: |
            dist/installers/*.exe
            dist/installers/*.AppImage
            dist/installers/*.deb
            dist/installers/*.dmg
            dist/installers/*.zip
            dist/installers/SHA256SUMS
          if-no-files-found: error
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hermes-voice-preview-*
          path: dist/native-artifacts
      - name: Verify native artifacts and prepare downloads
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil
          source = pathlib.Path('dist/native-artifacts')
          target = pathlib.Path('dist/release')
          target.mkdir(parents=True)
          def digest(path):
              result = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      result.update(chunk)
              return result.hexdigest()
          count = 0
          for manifest in source.glob('*/SHA256SUMS'):
              for row in manifest.read_text().splitlines():
                  expected, name = row.split('  ', 1)
                  assert pathlib.PurePath(name).name == name
                  artifact = manifest.parent / name
                  assert artifact.is_file() and digest(artifact) == expected
                  assert not (target / name).exists(), 'Duplicate artifact name'
                  shutil.copyfile(artifact, target / name)
                  count += 1
          assert count == 5, f'Expected five native installers, received {count}'
          for name in ['install-linux.sh', 'install-windows.ps1']:
              shutil.copyfile(pathlib.Path('scripts') / name, target / name)
          shutil.copyfile('docs/install.md', target / 'INSTALL.md')
          files = sorted(target.iterdir())
          (target / 'SHA256SUMS').write_text(''.join(f'{digest(path)}  {path.name}\n' for path in files))
          print(f'Verified {count} native installer hashes; scripts and installation guide included.')
          PY
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --prerelease --title "Hermes Voice $GITHUB_REF_NAME" --notes-file docs/preview-release-notes.md
