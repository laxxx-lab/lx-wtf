<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Lilith · Aktivität</title><link rel="stylesheet" href="activity-card.css"></head>
<body><header><span class="brand">LILITH <span>/ AKTIVITÄT</span></span><button id="card-dismiss" type="button" aria-label="Aktivitätskarte schließen" title="Diese Karte schließen">×</button></header>
<main><p id="card-empty" role="status">Noch keine aktuelle Aktivität.</p><article id="card-content" hidden><div class="card-heading"><span id="card-status"></span><span id="card-source"></span></div><h1 id="card-title"></h1><p id="card-detail"></p>
<section id="countdown-block" aria-label="Restzeit" hidden><span id="countdown-label"></span><strong id="card-countdown">0:00</strong><progress id="card-progress" max="1" value="0" aria-label="Fortschritt laut Start- und Endzeit" hidden></progress><p id="card-time-status" role="status"></p></section>
<section id="camera-block" aria-label="Kamerabild" hidden><div class="camera-preview"><video id="camera-video" autoplay muted playsinline hidden></video><img id="camera-image" alt="Momentaufnahme der ausgewählten Kamera" hidden></div><p id="camera-state" role="status">Kamerabild noch nicht verbunden.</p><button id="camera-open" type="button">Kamera in Home Assistant öffnen ↗</button></section>
</article><p id="card-notice" role="status" hidden></p></main>
<footer><span id="card-observed"></span><div id="card-navigation" hidden><button id="card-previous" type="button" aria-label="Vorige Aktivität">←</button><span id="card-position"></span><button id="card-next" type="button" aria-label="Nächste Aktivität">→</button></div></footer><script src="activity-card.js"></script></body></html>
